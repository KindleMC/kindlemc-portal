<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kindle MC | Sanctuary Web Portal</title>
    
    <!-- Browser Tab Icon -->
    <link rel="icon" type="image/png" href="src/assets/icon.png">

    <link rel="stylesheet" href="src/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

    <header>
        <div class="logo">🔥 Kindle MC</div>
        <nav>
            <button class="nav-btn active" onclick="switchTab('about')">🏡 About</button>
            <button class="nav-btn" onclick="switchTab('constitution')">📜 Constitution</button>
            <button class="nav-btn" onclick="switchTab('statutes')">⚖️ Statutes</button>
            <button class="nav-btn" onclick="switchTab('civics')">🏛️ Civics</button>
            <button class="theme-toggle" onclick="toggleTheme()" id="theme-btn">🌙 Dark</button>
        </nav>
    </header>

    <main>
        <!-- ABOUT TAB -->
        <section id="about" class="tab-content active">
            <div class="hero">
                <!-- Title Logo -->
                <img src="src/assets/logo.png" alt="Kindle MC" class="hero-logo" onerror="this.style.display='none'">
                
                <!-- IP Button & Clean Status Badge (Removed extra dot emoji from text) -->
                <div class="hero-ip-bar">
                    <button class="action-btn" onclick="copyIP()">✨ Copy Server IP: kindlemc.mcshost.com</button>
                    <span class="server-status-badge">Online • Survival 26.3+</span>
                </div>

                <!-- 4-Column Navigation Grid -->
                <div class="nav-card-grid">
                    <div class="nav-card" onclick="switchTab('constitution')">
                        <img src="src/assets/icons/icon-constitution.png" alt="Constitution" onerror="this.src='src/assets/icon.png'">
                        <span>Constitution</span>
                    </div>
                    <div class="nav-card" onclick="switchTab('statutes')">
                        <img src="src/assets/icons/icon-statutes.png" alt="Rules" onerror="this.src='src/assets/icon.png'">
                        <span>Rules</span>
                    </div>
                    <div class="nav-card" onclick="switchTab('civics')">
                        <img src="src/assets/icons/icon-civics.png" alt="Civics" onerror="this.src='src/assets/icon.png'">
                        <span>Civics</span>
                    </div>
                </div>
            </div>

            <div id="about-doc" class="md-body">
                <p class="loading-text">🔥 Loading About page...</p>
            </div>
        </section>

        <!-- CONSTITUTION TAB -->
        <section id="constitution" class="tab-content">
            <div id="constitution-doc" class="md-body">
                <p class="loading-text">🔥 Loading Constitution...</p>
            </div>
        </section>

        <!-- STATUTES TAB -->
        <section id="statutes" class="tab-content">
            <div id="statutes-doc" class="md-body">
                <p class="loading-text">🔥 Loading Statutory Laws...</p>
            </div>
        </section>

        <!-- CIVICS TAB -->
        <section id="civics" class="tab-content">
            <div id="civics-doc" class="md-body">
                <p class="loading-text">🔥 Loading Civics Guide...</p>
            </div>
        </section>
    </main>

    <footer>
        <p>Kindle MC • Built with kindness & trust 💛</p>
    </footer>

    <script src="src/js/app.js"></script>
</body>
</html>
